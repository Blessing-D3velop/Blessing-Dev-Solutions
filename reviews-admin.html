<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Review moderation | Blessing Dev Solutions</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root { --bg:#0b0809; --surface:rgba(255,255,255,.05); --line:rgba(255,255,255,.12); --text:#f4ede9; --muted:#aa9f9b; --red:#d7263d; --green:#2bd48a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Segoe UI", system-ui, sans-serif; }
    main { width:min(900px, calc(100% - 32px)); margin:0 auto; padding:2rem 0 4rem; }
    h1 { font-size:1.7rem; margin:0 0 .3rem; }
    p { margin:0 0 1rem; color:var(--muted); }
    input, button { font:inherit; }
    input { padding:.7rem 1rem; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.4); color:var(--text); min-width:240px; }
    button { cursor:pointer; padding:.6rem 1.1rem; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-weight:600; }
    button:hover { border-color:rgba(255,255,255,.35); }
    .primary { background:linear-gradient(135deg,var(--red),#8f1426); border-color:transparent; }
    .tabs { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.4rem 0; }
    .tabs button[aria-pressed="true"] { background:linear-gradient(135deg,var(--red),#8f1426); border-color:transparent; }
    .card { padding:1.2rem 1.3rem; border:1px solid var(--line); border-radius:16px; background:var(--surface); margin-bottom:1rem; }
    .card .top { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:.5rem; }
    .stars { color:#f5b301; letter-spacing:.08em; } .stars i { color:rgba(255,255,255,.2); font-style:normal; }
    .meta { color:var(--muted); font-size:.88rem; }
    .text { white-space:pre-line; overflow-wrap:anywhere; margin:.4rem 0 1rem; color:#e6dcd8; }
    .actions { display:flex; flex-wrap:wrap; gap:.5rem; }
    .approve { border-color:rgba(43,212,138,.5); color:var(--green); }
    .reject, .delete { border-color:rgba(215,38,61,.5); color:#ff7d8d; }
    .badge { padding:.15rem .6rem; border-radius:999px; font-size:.78rem; border:1px solid var(--line); }
    .err { color:#ff7d8d; } .hidden { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>Review moderation</h1>
  <p>New reviews wait here. Only the ones you approve appear on your website.</p>

  <form id="login">
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <p class="err" id="loginErr" hidden></p>
  </form>

  <section id="panel" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <button id="signout" type="button">Sign out</button>
  </section>
</main>

<script>
  const $ = s => document.querySelector(s);
  let password = "";
  let current = "pending";
  const esc = v => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const stars = n => `<span class="stars" aria-label="${n} out of 5">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`;

  async function api(path, options = {}) {
    const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", "x-admin-password": password } });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { const e = new Error(data.error || "Request failed"); e.status = response.status; throw e; }
    return data;
  }

  function render(data) {
    const tabs = [["pending","Waiting"],["approved","Approved"],["rejected","Rejected"],["all","All"]];
    const total = data.counts.pending + data.counts.approved + data.counts.rejected;
    $("#tabs").innerHTML = tabs.map(([key,label]) => {
      const n = key === "all" ? total : data.counts[key];
      return `<button type="button" data-tab="${key}" aria-pressed="${key === current}">${label} (${n})</button>`;
    }).join("");

    $("#list").innerHTML = data.reviews.length ? data.reviews.map(r => `
      <article class="card">
        <div class="top">
          <div>${stars(r.rating)} &nbsp;<strong>${esc(r.name)}</strong>${r.business ? ` <span class="meta">- ${esc(r.business)}</span>` : ""}</div>
          <div class="meta"><span class="badge">${esc(r.status)}</span> ${new Date(r.created_at).toLocaleString("en-ZA")}</div>
        </div>
        <div class="text">${esc(r.comment)}</div>
        <div class="actions">
          ${r.status !== "approved" ? `<button class="approve" data-act="approve" data-id="${r.id}">Approve</button>` : ""}
          ${r.status !== "rejected" ? `<button class="reject" data-act="reject" data-id="${r.id}">Reject</button>` : ""}
          <button class="delete" data-act="delete" data-id="${r.id}">Delete</button>
        </div>
      </article>`).join("") : `<p>Nothing here yet.</p>`;
  }

  async function load() {
    try { render(await api(`/api/reviews/admin?status=${current}`)); }
    catch (e) {
      if (e.status === 401) { signOut(); $("#loginErr").textContent = "Wrong password."; $("#loginErr").hidden = false; }
      else { $("#list").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    }
  }

  function signOut() { password = ""; sessionStorage.removeItem("rvpw"); $("#panel").classList.add("hidden"); $("#login").classList.remove("hidden"); }

  $("#login").addEventListener("submit", async e => {
    e.preventDefault();
    password = $("#pw").value; $("#loginErr").hidden = true;
    try { await api("/api/reviews/admin?status=pending"); }
    catch (err) { $("#loginErr").textContent = err.status === 401 ? "Wrong password." : err.message; $("#loginErr").hidden = false; return; }
    try { sessionStorage.setItem("rvpw", password); } catch (x) {}
    $("#login").classList.add("hidden"); $("#panel").classList.remove("hidden"); load();
  });

  $("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { current = b.dataset.tab; load(); } });

  $("#list").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "delete" && !confirm("Delete this review permanently?")) return;
    b.disabled = true;
    try { await api("/api/reviews/admin", { method: "POST", body: JSON.stringify({ action: b.dataset.act, id: b.dataset.id }) }); load(); }
    catch (err) { alert(err.message); b.disabled = false; }
  });

  $("#signout").addEventListener("click", signOut);

  try { const saved = sessionStorage.getItem("rvpw"); if (saved) { password = saved; $("#login").classList.add("hidden"); $("#panel").classList.remove("hidden"); load(); } } catch (x) {}
</script>
</body>
</html>
